name: Release

on:
  push:
    tags:
      # Keep PagePop releases distinguishable from upstream Nacos tags.
      - "v*-pagepop.*"

permissions:
  contents: write

jobs:
  # PagePop publishes GitHub Release assets only; the upstream npm scope is not used.
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
